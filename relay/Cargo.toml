[package]
name = "relay"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
# WebSocket over switchnet TCP (module `switchnet`): ws:// and wss:// (through sheath) clients,
# a ws:// server.
switchnet = ["dep:switchnet", "dep:switch", "dep:rustls", "sheath/switchnet"]
# Test-only: the Docker end-to-end tests (DPDK net_tap, Linux), on switchnet's testkit.
e2e = ["switchnet", "switchnet/testkit", "dep:zhida-test-support", "dep:tap-echo"]

[dependencies]
# Client-role frame masks (RFC 6455 §5.3) and Sec-WebSocket-Key: per-connection CSPRNG.
rand = "0.10"
# The TLS lower layer (TlsRx/TlsTx) and the frame traits.
sheath.workspace = true
# The WebSocket upgrade (rare path): HTTP response parse, Sec-WebSocket-Accept check.
httparse = "1.10"
sha1 = "0.11"
data-encoding = "2.11"
rustls = { version = "=0.23.43", default-features = false, features = ["std"], optional = true }
switchnet = { workspace = true, optional = true }
# yield_now: a failed connection lets the Net send its alert before the socket is dropped.
switch = { workspace = true, optional = true }
zhida-test-support = { workspace = true, optional = true }
# The Autobahn driver (bin relay-autobahn): tester process, EAL and net_tap Port.
tap-echo = { workspace = true, optional = true }

[dev-dependencies]
rustls = { version = "=0.23.43", default-features = false, features = ["ring", "std"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
tungstenite.workspace = true
trybuild = "1.0"
# setsockopt in the Docker end-to-end tests.
libc.workspace = true

[[bin]]
name = "relay-autobahn"
required-features = ["e2e"]

[[test]]
name = "wss_switchnet"
required-features = ["e2e"]

[[test]]
name = "compile_fail"
required-features = ["switchnet"]

[lints]
workspace = true
