[package]
name = "depot"
version = "0.1.0"
edition = "2024"
description = "Cache-optimized pool allocator returning generation-checked handles"

[features]
default = []
test-utils = []

[dependencies]

[dev-dependencies]
depot = { path = ".", features = ["test-utils"] }
quickcheck = "1"
quickcheck_macros = "1"
criterion = "0.5"
rand = { version = "0.8", features = ["small_rng"] }
trybuild = "1.0"

[[bench]]
name = "alloc"
harness = false

[[bench]]
name = "pool"
harness = false

[[bench]]
name = "pool_2p24"
harness = false
