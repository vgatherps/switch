[package]
name = "depot"
version.workspace = true
edition.workspace = true
description = "Cache-optimized pool allocator returning generation-checked handles"

[features]
default = []
test-utils = []

[dependencies]

[dev-dependencies]
depot = { workspace = true, features = ["test-utils"] }
quickcheck.workspace = true
quickcheck_macros.workspace = true
criterion.workspace = true
rand = { version = "0.8", features = ["small_rng"] }
trybuild = "1.0"

[[bench]]
name = "alloc"
harness = false

[[bench]]
name = "pool"
harness = false

[[bench]]
name = "pool_2p24"
harness = false
