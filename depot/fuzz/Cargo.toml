[package]
name = "depot-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }

[dependencies.depot]
path = ".."
features = ["test-utils"]

[[bin]]
name = "heap_ops"
path = "fuzz_targets/heap_ops.rs"
test = false
doc = false
bench = false
