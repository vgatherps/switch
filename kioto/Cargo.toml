[workspace]
members = [
    "crates/bench-core",
    "crates/bench-sender-mio",
    "crates/bench-sender-tokio",
    "crates/bench-victim-mio",
    "crates/bench-victim-tokio",
]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
bench-core = { path = "crates/bench-core" }
ctrlc = "3.4"
mio = { version = "1.0", features = ["net", "os-poll"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", default-features = false, features = ["io-util", "macros", "net", "rt", "signal", "time"] }
