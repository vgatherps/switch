[package]
name = "switch-tls"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
# TLS over switch-net TCP (module `switch-net`): the handshake, then the two halves.
switch-net = ["dep:switch-net"]
# Test-only: the Docker end-to-end test and TLS-Anvil's driver (DPDK net_tap, Linux), on
# switch-net's testkit.
e2e = ["switch-net", "switch-net/testkit", "dep:switch-test-support"]

[dependencies]
rustls = { version = "=0.23.43", default-features = false, features = ["std"] }
switch-net = { workspace = true, optional = true }
switch-test-support = { workspace = true, optional = true }

[dev-dependencies]
rustls = { version = "=0.23.43", default-features = false, features = ["ring", "std"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
switch.workspace = true
libc.workspace = true

[[test]]
name = "tls_switch_net"
required-features = ["e2e"]

# TLS-Anvil's client-test driver (`make docker-tls-anvil`).
[[example]]
name = "tls_anvil"
required-features = ["e2e"]

[lints]
workspace = true
