[package]
name = "sheath"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
# TLS over switchnet TCP (module `switchnet`): the handshake, then the two halves.
switchnet = ["dep:switchnet", "dep:switch"]

[dependencies]
rustls = { version = "=0.23.43", default-features = false, features = ["std"] }
switchnet = { workspace = true, optional = true }
# yield_now: a failed connection lets the Net send its alert before the socket is dropped.
switch = { workspace = true, optional = true }

[dev-dependencies]
rustls = { version = "=0.23.43", default-features = false, features = ["ring", "std"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }

# The Docker end-to-end test and TLS-Anvil's driver (`--features switchnet`): DPDK net_tap,
# Linux only.
[target.'cfg(target_os = "linux")'.dev-dependencies]
switch.workspace = true
switchnet = { workspace = true, features = ["testkit"] }
zhida-test-support.workspace = true

[[test]]
name = "tls_switchnet"
required-features = ["switchnet"]

# TLS-Anvil's client-test driver (`make docker-tls-anvil`).
[[example]]
name = "tls_anvil"
required-features = ["switchnet"]

[lints]
workspace = true
