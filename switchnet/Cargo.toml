zhida-dpdk-sys = { workspace = true, optional = true }
junctiond = { workspace = true, optional = true }
ceph-fifo = { workspace = true, optional = true }
ceph-ring = { workspace = true, optional = true }

[dev-dependencies]
switchnet = { workspace = true, features = ["testkit"] }
