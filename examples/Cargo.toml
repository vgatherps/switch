[package]
name = "switch-examples"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
net = ["switch/net"]
tls = ["net", "switch/tls", "dep:rustls"]
ws = ["tls", "switch/ws"]

[dependencies]
switch.workspace = true
rustls = { version = "=0.23.43", default-features = false, features = ["ring", "std"], optional = true }

[[example]]
name = "first_task"
path = "first_task.rs"

[[example]]
name = "basic"
path = "basic.rs"

[[example]]
name = "tasks"
path = "tasks.rs"

[[example]]
name = "manual_loop"
path = "manual_loop.rs"

[[example]]
name = "oneshot"
path = "oneshot.rs"

[[example]]
name = "remote_wake"
path = "remote_wake.rs"

[[example]]
name = "clock_loop"
path = "clock_loop.rs"

[[example]]
name = "tcp_client_local"
path = "tcp_client_local.rs"
required-features = ["net"]

[[example]]
name = "tcp_echo_server"
path = "tcp_echo_server.rs"
required-features = ["net"]

[[example]]
name = "tcp_client_junction"
path = "tcp_client_junction.rs"
required-features = ["net"]

[[example]]
name = "udp_echo"
path = "udp_echo.rs"
required-features = ["net"]

[[example]]
name = "ws_echo_server"
path = "ws_echo_server.rs"
required-features = ["ws"]

[[example]]
name = "tls_client"
path = "tls_client.rs"
required-features = ["tls"]

[[example]]
name = "wss_client"
path = "wss_client.rs"
required-features = ["ws"]

[lints]
workspace = true
