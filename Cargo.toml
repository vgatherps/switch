[workspace]
resolver = "3"
members = [
    # conduit
    "conduit/crates/switch-buffer",
    "conduit/crates/switch-dpdk-sys",
    "conduit/crates/dpdk-smoltcp",
    "conduit/crates/switch-tap-echo",
    "conduit/crates/switch-memif-bench",
    "conduit/crates/switch-binance-feed",
    "conduit/crates/switch-nic",
    "conduit/crates/switch-netconf",
    "conduit/crates/switch-open",
    "conduit/crates/switch-sockperf-wire",
    "conduit/switch-test-support",
    "conduit/switch-test-support/switch-test-kit",
    "conduit/switch-test-support/switch-test-support-macros",
    # cephalopod
    "cephalopod/crates/rseq",
    "cephalopod/crates/ring",
    "cephalopod/crates/fifo",
    "cephalopod/crates/proto",
    "cephalopod/crates/control",
    # switch
    "switch-runtime",
    "switch",
    "examples",
    "switch-macros",
    # switch-depot (task slot numbers for switch)
    "switch-depot",
    # switch-net
    "switch-net",
    # switch-ws (WebSocket over conduit frames)
    "switch-ws",
    # TLS 1.3 client over conduit frames
    "switch-tls",
    # latency/load bench (plans/bench/design.md)
    "switch-bench",
    # NIC hardware RX stamp → now latency on the CPU's invariant counter
    # shared-memory backing and single/double mappings
    "shared-memory",
    # shared packet frames
    "switch-frame",
    # switch-junction (host control protocol and client session)
    "switch-junction",
    "switch-junctiond",
    # one-writer, one-reader shared-memory record ring (the junction receive ring)
    "slice_ringbuffer",
]
exclude = ["conduit/vendor/smoltcp", "vendor/rustls"]

[workspace.package]
license = "GPL-3.0-only"
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
# external
criterion = "0.5"
libc = "0.2"
# global allocator of switch-nic and switch-bench
mimalloc = "0.1.52"
proptest = "1.5"
quickcheck = "1"
quickcheck_macros = "1"
serde = "1"
serde_json = "1"
tungstenite = "=0.30.0"

# internal
switch-binance-feed = { path = "conduit/crates/switch-binance-feed" }
ceph-rseq = { path = "cephalopod/crates/rseq" }
ceph-ring = { path = "cephalopod/crates/ring" }
ceph-fifo = { path = "cephalopod/crates/fifo" }
ceph-proto = { path = "cephalopod/crates/proto" }
ceph-control = { path = "cephalopod/crates/control" }
switch-depot = { path = "switch-depot" }
dpdk-smoltcp = { path = "conduit/crates/dpdk-smoltcp" }
switch-junction = { path = "switch-junction" }
switch-junctiond = { path = "switch-junctiond" }
switch-frame = { path = "switch-frame" }
switch-ws = { path = "switch-ws" }
switch-tls = { path = "switch-tls" }
shared-memory = { path = "shared-memory" }
slice_ringbuffer = { path = "slice_ringbuffer" }
# vendor/rustls is generated by vendor/rustls.sh from the crates.io release + vendor/patches/rustls
rustls = { version = "=0.23.43", path = "vendor/rustls", default-features = false }
smoltcp = { version = "=0.14.0", path = "conduit/vendor/smoltcp", default-features = false }
switch-sockperf-wire = { path = "conduit/crates/switch-sockperf-wire" }
switch-runtime = { path = "switch-runtime" }
switch = { path = "switch" }
switch-macros = { path = "switch-macros" }
switch-net = { path = "switch-net" }
switch-tap-echo = { path = "conduit/crates/switch-tap-echo" }
switch-buffer = { path = "conduit/crates/switch-buffer" }
switch-dpdk-sys = { path = "conduit/crates/switch-dpdk-sys" }
switch-netconf = { path = "conduit/crates/switch-netconf" }
switch-open = { path = "conduit/crates/switch-open" }
switch-test-kit = { path = "conduit/switch-test-support/switch-test-kit" }
switch-test-support = { path = "conduit/switch-test-support" }
switch-test-support-macros = { path = "conduit/switch-test-support/switch-test-support-macros" }

[workspace.lints.clippy]
doc_lazy_continuation = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
