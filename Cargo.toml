[workspace]
resolver = "3"
members = [
    # conduit
    "conduit/crates/zhida-buffer",
    "conduit/crates/zhida-dpdk-sys",
    "conduit/crates/dpdk-smoltcp",
    "conduit/crates/tap-echo",
    "conduit/crates/memif-bench",
    "conduit/crates/binance-feed",
    "conduit/crates/nic-runner",
    "conduit/crates/netconf",
    "conduit/crates/netconf-open",
    "conduit/crates/sockperf-wire",
    "conduit/test-support",
    "conduit/test-support/kit",
    "conduit/test-support/macros",
    # cephalopod
    "cephalopod/crates/rseq",
    "cephalopod/crates/ring",
    "cephalopod/crates/fifo",
    "cephalopod/crates/proto",
    "cephalopod/crates/control",
    # switch
    "switch",
    "switch-macros",
    # depot (task slot numbers for switch)
    "depot",
    # switchnet
    "switchnet",
    # relay (WebSocket over conduit frames)
    "relay",
    # TLS 1.3 client over conduit frames
    "sheath",
    # NIC hardware RX stamp → now latency on the CPU's invariant counter
    "nic-clock",
    # latency/load bench (plans/bench/design.md)
    "bench",
]
exclude = ["conduit/vendor/smoltcp", "vendor/rustls"]

[workspace.package]
license = "GPL-3.0-only"
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
# external
criterion = "0.5"
libc = "0.2"
# global allocator of zhida-nic and zhida-bench
mimalloc = "0.1.52"
proptest = "1.5"
quickcheck = "1"
quickcheck_macros = "1"
serde = "1"
serde_json = "1"
tungstenite = "=0.30.0"

# internal
binance-feed = { path = "conduit/crates/binance-feed" }
ceph-rseq = { path = "cephalopod/crates/rseq" }
ceph-ring = { path = "cephalopod/crates/ring" }
ceph-fifo = { path = "cephalopod/crates/fifo" }
ceph-proto = { path = "cephalopod/crates/proto" }
ceph-control = { path = "cephalopod/crates/control" }
depot = { path = "depot" }
dpdk-smoltcp = { path = "conduit/crates/dpdk-smoltcp" }
nic-clock = { path = "nic-clock" }
relay = { path = "relay" }
sheath = { path = "sheath" }
smoltcp = { version = "=0.14.0", path = "conduit/vendor/smoltcp", default-features = false }
sockperf-wire = { path = "conduit/crates/sockperf-wire" }
switch = { path = "switch" }
switch-macros = { path = "switch-macros" }
switchnet = { path = "switchnet" }
tap-echo = { path = "conduit/crates/tap-echo" }
zhida-buffer = { path = "conduit/crates/zhida-buffer" }
zhida-dpdk-sys = { path = "conduit/crates/zhida-dpdk-sys" }
zhida-netconf = { path = "conduit/crates/netconf" }
zhida-open = { path = "conduit/crates/netconf-open" }
zhida-test-kit = { path = "conduit/test-support/kit" }
zhida-test-support = { path = "conduit/test-support" }
zhida-test-support-macros = { path = "conduit/test-support/macros" }

[workspace.lints.clippy]
doc_lazy_continuation = "allow"

# generated by vendor/rustls.sh from the crates.io release + vendor/patches/rustls
[patch.crates-io]
rustls = { path = "vendor/rustls" }

[profile.release]
lto = "thin"
codegen-units = 1
