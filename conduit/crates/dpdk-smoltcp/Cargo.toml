[package]
name = "dpdk-smoltcp"
version.workspace = true
edition = "2021"
license.workspace = true

[features]
bench-offload = []
# smoltcp's O(N)-per-packet cross-checks, for the debug test and fuzz builds (Makefile
# DIAGNOSTICS); never for release or production builds.
diagnostics = ["smoltcp/diagnostics"]

[dependencies]
smoltcp = { workspace = true, features = ["auto-icmp-echo-reply", "dpdk"] }
zhida-buffer.workspace = true
zhida-dpdk-sys.workspace = true

[dev-dependencies]
zhida-test-kit.workspace = true
zhida-test-support.workspace = true
criterion.workspace = true
libc.workspace = true

[[bench]]
name = "ring"
harness = false

[[bench]]
name = "stack"
harness = false

[[bench]]
name = "scaling"
harness = false

[[bench]]
name = "neighbor"
harness = false

[[bench]]
name = "emit"
harness = false

[[bench]]
name = "rx"
harness = false

[[bench]]
name = "udp"
harness = false
required-features = ["bench-offload"]

[[bench]]
name = "tx_phases"
harness = false
required-features = ["bench-offload"]
