[package]
name = "dpdk-smoltcp"
version.workspace = true
edition = "2021"
license.workspace = true

[features]
bench-offload = []

[dependencies]
smoltcp = { workspace = true, features = ["udp-set", "auto-icmp-echo-reply"] }
zhida-buffer.workspace = true
zhida-dpdk-sys.workspace = true

[dev-dependencies]
zhida-test-kit.workspace = true
zhida-test-support.workspace = true
criterion.workspace = true
libc.workspace = true

[[bench]]
name = "ring"
harness = false

[[bench]]
name = "stack"
harness = false

[[bench]]
name = "scaling"
harness = false

[[bench]]
name = "neighbor"
harness = false

[[bench]]
name = "emit"
harness = false

[[bench]]
name = "rx"
harness = false

[[bench]]
name = "udp"
harness = false
required-features = ["bench-offload"]
